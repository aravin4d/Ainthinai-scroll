<!doctype html><html lang="ta"><head><meta charset="utf-8"><title>மலை · ஆறு: an endless Tamil landscape scroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Newsreader:ital@1&display=swap">
<style>
:root{--paper:#f1e8d2;--ink:#26262e;--ui:rgba(244,236,216,.9);--line:#b9a77f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1d2230;--ink:#e9e2cf;--ui:rgba(29,34,48,.9);--line:#4a4f63}}
:root[data-theme="dark"]{--paper:#1d2230;--ink:#e9e2cf;--ui:rgba(29,34,48,.9);--line:#4a4f63}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden}
body{background:linear-gradient(#f6c98a,#fbeed8)}
.sun,.moon{position:fixed;z-index:0;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.moon{width:min(11vh,86px);aspect-ratio:1;filter:drop-shadow(0 0 14px rgba(230,235,255,.6))}
.moon svg{width:100%;height:100%}
.stars{position:fixed;z-index:0;left:0;top:0;width:2px;height:2px;border-radius:50%;opacity:0;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{filter:brightness(.6)}to{filter:brightness(1.4)}}
.tint{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:multiply;opacity:0}
#sc{position:relative;z-index:1;height:100%;overflow-x:scroll;overflow-y:hidden;scrollbar-width:none;cursor:grab;outline:none}
#sc::-webkit-scrollbar{display:none}
#st{display:flex;height:100%;width:max-content}
#st svg{flex:none;height:100svh;width:150svh;overflow:visible}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.26;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .45 0'/></filter><rect width='200' height='200' filter='url(%23g)'/></svg>")}
.ui,.tn{position:fixed;z-index:3;background:var(--ui);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(4px)}
.ui{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;max-width:calc(100% - 28px)}
.tn{left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:8px 12px;max-width:min(340px,calc(100% - 28px));font:500 15px/1.25 "Noto Serif Tamil",Georgia,serif}
.tn small{display:block;font:italic 13px/1.3 Newsreader,Georgia,serif;opacity:.85}
h1{margin:0;font:700 24px/1.2 "Noto Serif Tamil",Georgia,serif}
.ui p{margin:2px 0 0;font:italic 14px/1.2 Newsreader,Georgia,serif;opacity:.8}
button{font:600 13px/1 system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:3px;padding:8px 11px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid #d9531e;outline-offset:2px}
.wv{stroke-dasharray:12 26;--o:-76px;animation:fl 7s linear infinite}
.w2{stroke-dasharray:22 38;--o:-120px;animation:fl 12s linear infinite reverse}
.rn{stroke-dasharray:10 40;--o:-200px;animation:fl .9s linear infinite}
@keyframes fl{to{stroke-dashoffset:var(--o)}}
.bb{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(2.5px) rotate(1.4deg)}}
.sw{transform-box:fill-box;transform-origin:left bottom;animation:swy 4s ease-in-out infinite alternate}
@keyframes swy{to{transform:rotate(5deg)}}
.ts{transform-box:fill-box;transform-origin:50% 100%;animation:tsw 5s ease-in-out infinite alternate}
@keyframes tsw{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s ease-out infinite}
@keyframes sp{from{transform:scale(.5);opacity:.9}to{transform:scale(2);opacity:0}}
.cl{animation:cl 70s linear infinite alternate}
@keyframes cl{to{transform:translateX(90px)}}
.bf{animation:cl 45s linear infinite alternate}

.scene-hud{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));display:flex;align-items:flex-start;gap:8px;max-width:min(440px,calc(100% - 28px));transition:.25s ease}
.tn{position:relative;left:auto;top:auto;max-width:390px;border-radius:14px;padding:11px 14px;background:rgba(247,239,223,.96);color:#261a12;border:1.4px solid rgba(112,82,48,.42);box-shadow:0 12px 34px rgba(31,26,17,.24);backdrop-filter:blur(10px) saturate(1.12);transition:.25s ease}
.tn strong{display:block;font:700 17px/1.25 "Noto Serif Tamil",Georgia,serif;color:#1f140d}.tn small{margin-top:3px;color:rgba(38,26,18,.88)}
.hud-toggle{width:38px;height:38px;min-width:38px;padding:0;border-radius:50%;background:rgba(248,240,220,.84);box-shadow:0 8px 24px rgba(31,26,17,.12);backdrop-filter:blur(10px);font-size:17px}
.scene-hud.closed .tn{opacity:0;transform:translateX(-12px);pointer-events:none;width:0;padding-left:0;padding-right:0;border-width:0;overflow:hidden}
.scene-hud.closed{max-width:48px}.scene-hud.closed .hud-toggle{transform:rotate(180deg)}
.ui{display:none}
.ui .brand{display:none}.ui button{border-color:rgba(38,38,46,.28);border-radius:999px;padding:9px 12px;background:rgba(255,255,255,.24)}
#sc{touch-action:pan-x;overscroll-behavior:none}.grain{opacity:.15}
.bird{transform-box:fill-box;transform-origin:center;animation:wing 1.8s ease-in-out infinite alternate}.animal{filter:drop-shadow(0 1px .3px rgba(30,24,18,.22))}
@keyframes wing{to{transform:translateY(-2px) rotate(1.5deg)}}
@media (max-width:700px){
 #st svg{width:118svh;height:100svh}.scene-hud{top:calc(10px + env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));max-width:calc(100% - 116px)}
 .tn{font-size:13px;padding:9px 11px;max-width:calc(100vw - 122px)}.tn strong{font-size:15px}.tn small{font-size:11.5px;line-height:1.25}.hud-toggle{width:34px;height:34px;min-width:34px}
 .ui{right:max(10px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));padding:6px;gap:5px}.ui button{font-size:0;width:36px;height:36px;padding:0}.ui button:before{font-size:16px}.ui #dr:before{content:'Ⅱ'}.ui #nw:before{content:'↻'}
}
@media (max-height:520px){.tn small:last-child{display:none}.tn{padding:7px 10px}.scene-hud{top:8px}.ui{top:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="wob" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter>
<linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e9d3" stop-opacity="0"/><stop offset=".6" stop-color="#f2e9d3" stop-opacity=".22"/><stop offset="1" stop-color="#f2e9d3" stop-opacity="0"/></linearGradient>
<pattern id="pg1" width="5" height="4" patternUnits="userSpaceOnUse"><path d="M1 4V2M3.5 3V1" stroke="#336a2c" stroke-width=".9" fill="none"/></pattern>
<pattern id="pg2" width="9" height="7" patternUnits="userSpaceOnUse"><path d="M2 7V3M2 7L.5 4M2 7L3.5 4M6.5 4V0M6.5 4L5 1M6.5 4L8 1" stroke="#2f6428" stroke-width=".9" fill="none"/></pattern>
<pattern id="pm" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M2 8V3M5 6V1" stroke="#7a5214" stroke-width=".9"/><circle cx="2" cy="2.6" r="1.2" fill="#f0c050"/><circle cx="5" cy="1" r="1.2" fill="#f0c050"/></pattern>
<pattern id="pf" width="7" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5H6M1 3.5H7" stroke="#4a3322" stroke-opacity=".5" stroke-width=".8"/></pattern>
<pattern id="pw" width="10" height="6" patternUnits="userSpaceOnUse"><path d="M1 2H5M5 5H9" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/><path d="M2 5V3.4M7 2V.4" stroke="#3f7a35" stroke-width=".8"/></pattern>
<pattern id="pc" width="12" height="8" patternUnits="userSpaceOnUse"><path d="M0 4L4 2L6 5L10 3M6 5L7 8" stroke="#5a3a1e" stroke-opacity=".6" stroke-width=".8" fill="none"/></pattern>
<pattern id="ps" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M1 1h.6M4 3h.6M2 5h.6" stroke="#9aa0b0" stroke-width="1"/></pattern>
<pattern id="pp" width="7" height="6" patternUnits="userSpaceOnUse"><path d="M1 6V3M4 5V1" stroke="#4f7a3a" stroke-width=".9"/></pattern>
<linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd3b8"/><stop offset="1" stop-color="#7fa8aa"/></linearGradient>
</defs></svg>
<div class="stars" id="stars"></div><div class="sun" id="sun"></div>
<div class="moon" id="moon"><svg viewBox="-34 -34 68 68"><defs><mask id="mm"><rect x="-40" y="-40" width="80" height="80" fill="#fff"/><circle id="mk" r="30" cx="0" fill="#000"/></mask></defs><circle r="30" fill="#aab4cf" fill-opacity=".18"/><g mask="url(#mm)"><circle r="30" fill="#f3eed8"/><circle cx="-9" cy="-8" r="5" fill="#d8d2b8"/><circle cx="10" cy="6" r="7" fill="#dad4ba"/><circle cx="-4" cy="14" r="3.5" fill="#d8d2b8"/></g></svg></div>
<div class="scene-hud" id="sceneHud"><div class="tn" id="tn"></div><button class="hud-toggle" id="hudToggle" type="button" aria-label="Hide landscape details" aria-expanded="true">‹</button></div>
<main id="sc" tabindex="0" aria-label="Endless Tamil landscape. Drag or scroll sideways."><div id="st"></div></main>
<div class="tint" id="tint"></div><div class="grain"></div>

<script>
(()=>{
const W=900,H=600,FY=470,INK='#26262e',f=n=>Math.round(n*10)/10;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkNoise(s){const r=rng(s),p=[];for(let i=0;i<256;i++)p.push(r());return x=>{const i=Math.floor(x),t=x-i,u=t*t*(3-2*t);return p[i&255]*(1-u)+p[(i+1)&255]*u}}
const P=(d,a)=>`<path d="${d}" ${a||''}/>`,C=(x,y,r,c)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}"/>`,E=(x,y,a,b,c,t)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(a)}" ry="${f(b)}" fill="${c}" ${t||''}/>`,R=(x,y,w,h,c,t)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${c}" ${t||''}/>`,G=(x,y,s,i,c)=>`<g transform="translate(${f(x)} ${f(y)}) scale(${s})" ${c||''}>${i}</g>`,ST=(c,w)=>`fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"`;
let seed=Math.random()*1e4|0,N,CC,count=0;
const noises=()=>{CC={};N={};'abcdefgh'.split('').forEach((k,i)=>N[k]=mkNoise(seed+i*17+1))};
const Z=x=>N.e(x/1900),ar=x=>sm(.72,.8,Z(x)),hz=x=>sm(.25,.7,Z(x));
const kind=i=>{const z=Z(i*W+W/2);return z<.24?'neithal':z<.41?'marutham':z<.58?'mullai':z<.76?'kurinji':'palai'};
const NAMES={neithal:['நெய்தல்','Neithal · coast','Sea wind, salt pans, fishing hamlets, punnai and screw-pine · seabirds and shark'],marutham:['மருதம்','Marutham · fertile river plain','Paddy, canals, tanks and farm villages · buffalo, water birds and field work'],mullai:['முல்லை','Mullai · forest and pasture','Woodland grazing country · cattle, deer, hare and quiet cattle paths'],kurinji:['குறிஞ்சி','Kurinji · mountain country','Rocky folds, shola-like green, waterfalls, millet and honey · elephant, tiger, peacock and parrot'],palai:['பாலை','Palai · heat-transformed dry tract','Parched Kurinji/Mullai under fierce heat · thorn scrub, long journeys, red dog and raptors']};
const TL=[['காலை','Early day'],['நண்பகல்','Midday'],['மாலை','Evening'],['யாமம்','Midnight'],['வைகறை','Before dawn']];
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)),mx=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const GR=['#b4c4cf','#8fa9b7','#6b8f6f','#4f7352','#4a6a4e','#2d4434'],AR=['#d8b895','#cfa77f','#b8805a','#a06a48','#a98456','#8a5a3a'];
const grad=(i,j,x0)=>`<linearGradient id="g${i}_${j}" gradientUnits="userSpaceOnUse" x1="${x0}" x2="${x0+W}"><stop offset="0" stop-color="${mx(GR[j],AR[j],ar(x0))}"/><stop offset="1" stop-color="${mx(GR[j],AR[j],ar(x0+W))}"/></linearGradient>`;

// mountains: distinct peaks with bell profiles, like layered shan-shui ranges; whole cells can be missing, leaving plains
const ha=x=>.35+.65*hz(x);
function ridge(L,sc,amp,base,x){
 const n=N['abcf'[L]],xx=x+L*3100,zone=N.g(xx/(850-80*L)+L*13),shape=N.h(xx/(1250-90*L)+31);
 let v=0,a=.56,fr=.78,s=0;for(let o=0;o<5;o++){let q=n(xx/sc*fr+o*9.17);q=o<2?q:1-Math.abs(2*q-1);v+=a*q;s+=a;a*=.52;fr*=2.22}
 const shoulder=Math.pow(Math.abs(Math.sin(xx/(160+L*34)+shape*5.8)),1.7)*(L<2?.18:.1);
 const crag=(L<2?.22:.11)*Math.pow(Math.max(0,Math.sin(xx/(74+L*13)+shape*8.4)),5);
 const env=ha(x)*sm(.20,.62,zone);v=Math.max(0,(v/s-.18)*1.48+shoulder+crag);
 const profile=Math.pow(v,.82+shape*.58);
 return base-amp*env*profile+(1-env)*(24+12*N.d(x/340+L*7));
}
// river: curved, widens and narrows, dries up in Palai, returns after
const sea=x=>1-sm(.14,.26,Z(x)),rc=x=>(1-sea(x))*(508+N.c(x/170)*26-13+N.d(x/60)*4)+sea(x)*512,B=x=>13+22*N.d(x/230+40),hw=x=>(1-sea(x))*B(x)*(1-ar(x))*(.25+.75*sm(.3,.5,N.g(x/700+31)))+sea(x)*34;
const bedHW=x=>hw(x)*1.12+B(x)*.9*sm(.3,.7,ar(x)),nbt=x=>rc(x)+bedHW(x)+9+N.c(x/50)*4;

function layer(x0,fn,fill,r,hc,hl,vg,vc,kc){const pts=[];for(let x=x0-4;x<=x0+W+4;x+=4)pts.push([x,fn(x)]);
 const top=pts.map(p=>f(p[0])+' '+f(p[1])).join('L');let a='',b='',c='',t='',sd='',run=[];
 const flush=()=>{if(run.length>3){const A=run[0],Bp=run[run.length-1],d=Bp[1]-A[1];if(d>10){sd+=`M${f(A[0])} ${f(A[1])}`+run.map(p=>`L${f(p[0])} ${f(p[1])}`).join('')+`L${f(A[0]+(Bp[0]-A[0])*.14)} ${f(Bp[1]+3)}L${f(A[0]+(r()-.3)*5)} ${f(A[1]+d*.5)}Z`;for(const[x,y]of run)if(r()<.7){const l=Math.min(d*.8,hl*(.6+r()));t+=`M${f(x)} ${f(y+2)}l${f(-l*.28)} ${f(l)}`}}}run=[]};
 for(let j=0;j<pts.length;j++){const q=pts[j],nx=pts[j+1];if(nx&&nx[1]>q[1]+.3)run.push(q);else{if(run.length)run.push(q);flush()}}
 for(const[x,y]of pts){if(vg(x)>.5&&r()<.85*(1-ar(x)))for(let j=0;j<2;j++){const yy=y+5+r()*hl*1.3,q=3+r()*5,s=`M${f(x-q)} ${f(yy)}a${f(q)} ${f(q)} 0 1 0 ${f(q*2)} 0a${f(q)} ${f(q)} 0 1 0 ${f(-q*2)} 0`;if(kc&&r()<.2)c+=s;else if(r()<.5)a+=s;else b+=s}
  else if(r()<.3){const l=hl*(.4+r());t+=`M${f(x)} ${f(y+2)}l${f(-l*.3)} ${f(l)}l${f(l*.35)} ${f(l*.1)}`}}
 return{pts,svg:P(`M${top}L${x0+W+4} ${H}L${x0-4} ${H}Z`,`fill="${fill}"`)+P(sd,'fill="#16262b" fill-opacity=".26"')+P(`M${top}`,'fill="none" stroke="#26262e" stroke-opacity=".55" stroke-width="1"')+P(t,`fill="none" stroke="${hc}" stroke-opacity=".55" stroke-width=".8"`)+P(a,`fill="${vc[0]}" fill-opacity=".9"`)+P(b,`fill="${vc[1]}" fill-opacity=".9"`)+P(c,'fill="#6a58b8" fill-opacity=".9"')}}

// trees, base at 0,0
const leafy=(r,n,cy,sp,rr,cl)=>{let o='';for(let j=0;j<n;j++){const a=j/n*6.28;o+=E(Math.cos(a)*sp*(.4+r()*.6),cy+Math.sin(a)*rr*.6*(.4+r()*.6),rr*(.6+r()*.5),rr*(.45+r()*.3),cl[j%3],'fill-opacity=".95"')}return o+E(-sp*.3,cy-rr*.5,rr*.5,rr*.3,cl[3],'fill-opacity=".7"')};
const T={
palm:r=>{const l=(r()-.5)*30,h=70+r()*30;let o=P(`M0 0Q${f(l*.2)} ${f(-h/2)} ${f(l)} ${f(-h)}`,ST('#3b2f2a',3.2));for(let y=8;y<h;y+=9)o+=P(`M${f(l*(y/h)**2-2.2)} ${-y}h4.4`,ST('#6b5a4a',.7));
 for(let i=0;i<9;i++){const a=-Math.PI+.1+i*.3,L=34+r()*14,dx=Math.cos(a)*L,dy=Math.sin(a)*L+L*.3;o+=P(`M${f(l)} ${f(-h)}Q${f(l+dx*.5)} ${f(-h+dy*.5-8)} ${f(l+dx)} ${f(-h+dy)}Q${f(l+dx*.5)} ${f(-h+dy*.5+4)} ${f(l)} ${f(-h)}Z`,`fill="${i%2?'#3f6b45':'#4f8450'}" stroke="#26402c" stroke-width=".5"`)}
 return o+C(l-2,-h+4,2.6,'#7a5a2b')+C(l+2,-h+5,2.6,'#6b4a2b')},
panai:r=>{const h=85+r()*40,l=(r()-.5)*10;let o=P(`M0 0Q${f(l*.3)} ${f(-h/2)} ${f(l)} ${f(-h)}`,ST('#4a3a2e',3));for(let i=0;i<9;i++){const a=-Math.PI/2+(i-4)*.33,L=24+r()*6,d=`M${f(l)} ${f(-h)}L${f(l+Math.cos(a)*L)} ${f(-h+Math.sin(a)*L)}`;o+=P(d,ST('#3f6b45',3.6))+P(d,ST('#7aa862',1))}return o+C(l,-h+4,3.2,'#4a2e2b')},
banana:()=>{let o=P('M0 0V-30',ST('#7a8a4a',3));for(let i=0;i<6;i++){const a=(i-2.5)*32,q=a*Math.PI/180,cx=Math.sin(q)*14,cy=-30-Math.cos(q)*14;o+=E(cx,cy,5,17,i%2?'#6fa14a':'#5c9040',`transform="rotate(${a} ${f(cx)} ${f(cy)})" stroke="${INK}" stroke-width=".4"`)}return o+E(4,-22,2,4,'#c9b83a')},
banyan:r=>{let o=P('M-8 0q-3 -28 2 -48M8 0q3 -24 -2 -44',ST('#5a4331',6.8))+P('M0 0q0 -20 0 -56',ST('#4b3728',8));o+=P('M0 -54l-26 -14M0 -54l24 -16M-2 -40l-18 -9M2 -42l20 -11',ST('#5a4331',2.4));o+=leafy(r,14,-82,44,24,['#35563c','#466c47','#577e51','#86a86a']);for(let i=0;i<8;i++){const x=(i-3.5)*11;o+=P(`M${f(x)} -58V${f(-6-r()*20)}`,ST('#6a513d',1.3))}o+=P('M-18 -8q2 -13 0 -28M18 -6q-2 -14 0 -30',ST('#5a4331',2.2));return o},
mango:r=>P('M0 0q-2 -22 1 -40',ST('#4a3a30',5))+leafy(r,8,-56,24,15,['#2f5a35','#3f7040','#548a48','#7aa860'])+[0,1,2,3].map(()=>C((r()-.5)*40,-48-r()*18,1.8,'#e2b13c')).join(''),
